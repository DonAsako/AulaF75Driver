[workspace]
resolver = "3"
members = ["crates/aula", "crates/aulactl", "crates/aula-gui"]
# The GUI needs webkit2gtk-4.1: build it with `cargo run -p aula-gui`.
default-members = ["crates/aula", "crates/aulactl"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/DonAsako/AulaF75Driver"
rust-version = "1.85"
