[package]
name = "aula"
description = "Configuration protocol and Linux hidraw driver for the EPOMAKER x AULA F75 Max keyboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
gif = ["dep:image"]
serde = ["dep:serde"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif"], optional = true }
libc = "0.2"
serde = { workspace = true, optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
